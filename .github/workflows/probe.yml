name: probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          exec > probe-out.txt 2>&1
          q() { echo "=== $1"; curl -s -X POST https://gql.twitch.tv/gql -H "Client-ID: kimne78kx3ncx6brgo4mv6wki5h1ko" -H "Content-Type: application/json" --data "$2" | head -c 6000; echo; }
          for u in cohhcarnage pokimane lirik; do
            q "panels $u" '{"query":"query{user(login:\"'$u'\"){chatSettings{rules} panels{id type ... on DefaultPanel{title description imageURL linkURL}}}}"}'
          done
      - run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe-out.txt; git commit -m "probe output [skip ci]"; git push
