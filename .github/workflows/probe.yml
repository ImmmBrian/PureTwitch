name: probe
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: probe }
      - uses: actions/checkout@v4
        with: { ref: main, path: src }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - run: |
          cd src
          ./gradlew :core:allTests :app-windows:test --continue > ../out.txt 2>&1 || true
          cd ..
          { grep -E "^e: |FAILED|AssertionError|expected:<|Exception at|\.kt:[0-9]+" out.txt | head -60; echo ...; tail -40 out.txt; } > probe/probe-out.txt
          for f in $(grep -l "<failure" src/*/build/test-results/*/*.xml 2>/dev/null | head -5); do echo "== $f" >> probe/probe-out.txt; grep -A8 "<failure" $f | head -20 >> probe/probe-out.txt; done
      - run: |
          cd probe; git config user.name probe; git config user.email probe@users.noreply.github.com
          git add probe-out.txt; git commit -m "probe output [skip ci]"; git push
